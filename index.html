<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle English Academy - 숙제 및 진도 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- 9시 이후 미완료 숙제 경고 배너 -->
    <div id="warning-banner" class="hidden bg-rose-600 text-white px-4 py-3 text-center font-bold shadow-md sticky top-0 z-50 flex items-center justify-center gap-2">
        <span>🚨 [알림] 저녁 9시가 지났습니다! 아직 완료하지 못한 숙제가 있는지 확인하세요!</span>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- 상단 헤더 및 모드 전환 -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-8 gap-4 border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Seattle English Academy</h1>
                <p class="text-sm text-slate-500 mt-1">주간 숙제 및 수업 진도 관리 시스템</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <!-- 학년 전환 -->
                <div class="bg-slate-100 p-1 rounded-xl flex">
                    <button onclick="switchGrade('grade5')" id="btn-grade5" class="px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-900 shadow-sm">초5 과정</button>
                    <button onclick="switchGrade('grade6')" id="btn-grade6" class="px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900">초6 과정</button>
                </div>
                <!-- 모드 전환 -->
                <div class="bg-slate-100 p-1 rounded-xl flex">
                    <button onclick="switchMode('student')" id="btn-student" class="px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-indigo-600 shadow-sm">학생 모드</button>
                    <button onclick="switchMode('teacher')" id="btn-teacher" class="px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900">선생님 모드</button>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main id="main-content" class="space-y-8">
            <!-- 동적 렌더링 영역 -->
        </main>
    </div>

    <script>
        // 현재 상태 관리
        let currentGrade = 'grade5';
        let currentMode = 'student';
        let teacherTab = 'schedule'; // 'schedule' 또는 'homework'

        // 기본 데이터 설정 (원장님 제공 사진 원본 내용 반영)
        const defaultData = {
            grade5: {
                schedule: [
                    { period: "1교시 (Thur)", subject: "Reading + Word Test", content: "Grade 3 Harriet Tubman 내용파악과 어휘. W&M-Day 29", book: "p 99 - 101" },
                    { period: "2교시 (Sat)", subject: "Science", content: "Grade 3 Hurricane Hunters와 Plans 어휘와 토론", book: "p 108-109" },
                    { period: "3교시 (Sat)", subject: "Writing + 입시", content: "Grade 2 단어 나열시 Comma 활용법 연습. Noun/Pronoun 글쓰기 연습. Grammar 1 - 의문사", book: "p 80-82 , p 74-75" }
                ],
                homework: [
                    "1. To watch What's going on ? + 3 sentences you like.\n2. To listen and practice Day 30. (W&M)\n3. To write difficult words on page 110 , X3. (Science)",
                    "1. To finish page 81. (Writing)\n2. To read page 111 and find difficult words. (Science)\n3. To work on page 75. (K.Grammar)",
                    "1. To read MTH #10, chapter 1 to 3.\n2. To listen and practice Day 30.(W&M)",
                    "1. To read and find difficult words on page 112 . (Science)\n2. To write the misspelled words on page 82, X3. (Writing)",
                    "1. To read MTH #10, chapter 4 to 7.\n2. To listen and practice Day 30. (W&M)\n3. To memorize the 3 forms of each verb, be to bring (K.Grammar)",
                    "추후 공지 및 입력 예정",
                    "추후 공지 및 입력 예정"
                ]
            },
            grade6: {
                schedule: [
                    { period: "1교시 (Tue)", subject: "K.Listening / Voca (입시)", content: "Grade 7 K.Listening 6회 전반부, W&M 20 Test.", book: "To be filled in later." },
                    { period: "2교시 (Thur)", subject: "K.Reading / Voca (입시)", content: "Grade 6 K.Reading 22회. W&M 21 Test", book: "p 103" },
                    { period: "3교시 (Sat)", subject: "Grammar / Voca (입시)", content: "Grade 7 Grammar & 불규칙동사변화. W&M 22 Test", book: "p 96" }
                ],
                homework: [
                    "1. To watch What's goin on + 3 sentences you like.\n2. To write the misspelled words for Day 22 X3 + Prove. (W&M)\n3. To work on page 99. (K.Grammar)",
                    "1. To listen and practice Day 23 .(W&M)\n2. To read MTH #21, chapter 1 to 3.\n3. To work on pages 100-102. (K.Grammar)",
                    "1. To listen and practice Day 23 . (W&M)\n2. To read MTH #21, chapter 4 to 7.\n3. To memorize the 3 forms of each verb, hear to land. (K.Grammar)",
                    "1. To write the misspelled words for Day 23,X3 and Prove. (W&M)\n2. To do a dictation for Day 7, 1 -11. (K.Listening)\n3. To listen and practice Day 24. (W&M)\n4. To correct your wrong answers for Listening 11-15 and finish 16 -20.",
                    "1. To do a dictation for Day 7, 11-20.(K.Listening)\n2. To listen and practice Day 24. (W&M)",
                    "추후 공지 및 입력 예정",
                    "추후 공지 및 입력 예정"
                ]
            }
        };

        const dayLabels = [
            "Sat (토) - 9월 26일 (토)",
            "Sun (일) - 9월 27일 (일)",
            "Mon (월) - 9월 28일 (월)",
            "Tue (화) - 9월 29일 (화)",
            "Wed (수) - 9월 30일 (수)",
            "Thu (목) - 10월 1일 (목)",
            "Fri (금) - 10월 2일 (금)"
        ];

        // 데이터 로드 (LocalStorage 연동)
        function getData() {
            const saved = localStorage.getItem('sea_data_' + currentGrade);
            if (saved) {
                return JSON.parse(saved);
            }
            return defaultData[currentGrade];
        }

        function saveData(newData) {
            localStorage.setItem('sea_data_' + currentGrade, JSON.stringify(newData));
            alert('성공적으로 저장 및 등록되었습니다!');
            render();
        }

        function switchGrade(grade) {
            currentGrade = grade;
            document.getElementById('btn-grade5').className = grade === 'grade5' ? 'px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-900 shadow-sm' : 'px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900';
            document.getElementById('btn-grade6').className = grade === 'grade6' ? 'px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-900 shadow-sm' : 'px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900';
            render();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-student').className = mode === 'student' ? 'px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-indigo-600 shadow-sm' : 'px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900';
            document.getElementById('btn-teacher').className = mode === 'teacher' ? 'px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-indigo-600 shadow-sm' : 'px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900';
            render();
        }

        function switchTeacherTab(tab) {
            teacherTab = tab;
            render();
        }

        function render() {
            const data = getData();
            const container = document.getElementById('main-content');

            if (currentMode === 'student') {
                // 학생 모드 화면 (진도표 + 7일 숙제 체크리스트)
                container.innerHTML = `
                    <!-- 수업 진도표 -->
                    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                                <span>📚 이번 주 수업 진도표 (${currentGrade === 'grade5' ? '초5' : '초6'})</span>
                            </h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${data.schedule.map(s => `
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${s.period}</span>
                                    <h3 class="font-bold text-slate-800 mt-2">${s.subject}</h3>
                                    <p class="text-sm text-slate-600 mt-1">${s.content}</p>
                                    <p class="text-xs text-slate-400 mt-2">교재: ${s.book}</p>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- 주간 숙제 체크리스트 -->
                    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div class="mb-6">
                            <h2 class="text-lg font-bold text-slate-900">✏️ 주간 숙제 체크리스트 (Sat ~ Fri)</h2>
                            <p class="text-xs text-slate-500 mt-0.5">토요일부터 다음 주 금요일까지 일주일(7일) 전체 숙제 내용입니다.</p>
                        </div>
                        <div class="space-y-6">
                            ${data.homework.map((hwText, idx) => `
                                <div class="border border-slate-100 rounded-xl p-4 bg-slate-50/50">
                                    <h3 class="font-bold text-indigo-900 mb-3 text-sm flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                                        ${dayLabels[idx]}
                                    </h3>
                                    <ul class="space-y-2">
                                        ${hwText.split('\n').filter(line => line.trim() !== '').map(task => `
                                            <li class="flex items-start gap-3 bg-white p-3 rounded-lg border border-slate-100 shadow-2xs">
                                                <input type="checkbox" class="mt-1 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                                                <span class="text-sm text-slate-700 flex-1">${task}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            } else {
                // 선생님 모드 화면 (등록/수정 폼 디자인)
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <!-- 선생님 탭 버튼 -->
                        <div class="flex gap-2 mb-6 border-b border-slate-100 pb-4">
                            <button onclick="switchTeacherTab('schedule')" class="px-4 py-2 rounded-xl font-bold text-sm transition-all ${teacherTab === 'schedule' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600'}">
                                📚 수업 진도표 등록 (${currentGrade === 'grade5' ? '초5' : '초6'})
                            </button>
                            <button onclick="switchTeacherTab('homework')" class="px-4 py-2 rounded-xl font-bold text-sm transition-all ${teacherTab === 'homework' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600'}">
                                📝 숙제 공지 등록 (${currentGrade === 'grade5' ? '초5' : '초6'})
                            </button>
                        </div>

                        <p class="text-xs text-indigo-600 mb-6 font-medium">
                            💡 ${teacherTab === 'schedule' ? '교시별 수업 내용과 교재 범위를 입력하세요.' : '토요일부터 다음 주 금요일까지 일주일(7일) 전체 숙제 내용을 줄바꿈으로 입력하세요.'}
                        </p>

                        ${teacherTab === 'schedule' ? `
                            <form id="schedule-form" onsubmit="handleScheduleSubmit(event)" class="space-y-6">
                                ${data.schedule.map((s, i) => `
                                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-3">
                                        <h3 class="font-bold text-indigo-900 text-sm">${i+1}교시 정보</h3>
                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            <input type="text" name="period_${i}" value="${s.period}" placeholder="예: 1교시 (Thur)" class="p-2.5 rounded-lg border border-slate-300 text-sm bg-white">
                                            <input type="text" name="subject_${i}" value="${s.subject}" placeholder="과목명 (예: Reading + Word Test)" class="p-2.5 rounded-lg border border-slate-300 text-sm bg-white">
                                            <input type="text" name="book_${i}" value="${s.book}" placeholder="교재 범위 (예: p 99 - 101)" class="p-2.5 rounded-lg border border-slate-300 text-sm bg-white">
                                        </div>
                                        <textarea name="content_${i}" rows="2" placeholder="상세 수업 내용" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm bg-white">${s.content}</textarea>
                                    </div>
                                `).join('')}
                                <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                                    💾 수업 진도표 실시간 등록/저장
                                </button>
                            </form>
                        ` : `
                            <form id="homework-form" onsubmit="handleHomeworkSubmit(event)" class="space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${dayLabels.map((dayName, i) => `
                                        <div class="border border-slate-200 rounded-xl p-4 bg-slate-50/50">
                                            <label class="block font-bold text-indigo-900 mb-2 text-sm">${dayName}</label>
                                            <textarea name="hw_${i}" rows="5" class="w-full p-3 rounded-lg border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-indigo-500">${data.homework[i] || ''}</textarea>
                                        </div>
                                    `).join('')}
                                </div>
                                <button type="submit" class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                                    💾 해당 주간 숙제 내용 실시간 등록/저장
                                </button>
                            </form>
                        `}
                    </div>
                `;
            }
        }

        function handleScheduleSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const data = getData();
            for (let i = 0; i < 3; i++) {
                data.schedule[i] = {
                    period: form.querySelector(`[name="period_${i}"]`).value,
                    subject: form.querySelector(`[name="subject_${i}"]`).value,
                    book: form.querySelector(`[name="book_${i}"]`).value,
                    content: form.querySelector(`[name="content_${i}"]`).value
                };
            }
            saveData(data);
        }

        function handleHomeworkSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const data = getData();
            for (let i = 0; i < 7; i++) {
                data.homework[i] = form.querySelector(`[name="hw_${i}"]`).value;
            }
            saveData(data);
        }

        function checkTime() {
            const now = new Date();
            if (now.getHours() >= 21) {
                document.getElementById('warning-banner').classList.remove('hidden');
            }
        }

        render();
        checkTime();
    </script>
</body>
</html>
