<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle English Academy - 숙제 및 진도 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans+KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- 9시 이후 미완료 숙제 경고 배너 (오후 9시 이후 자동 활성화) -->
    <div id="warning-banner" class="hidden bg-rose-600 text-white px-4 py-3 text-center font-bold shadow-md sticky top-0 z-50 flex items-center justify-center gap-2">
        <span>🚨 [알림] 저녁 9시가 지났습니다! 아직 완료하지 못한 숙제가 있는지 확인하세요!</span>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- 상단 헤더 및 모드 전환 -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-8 gap-4 border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Seattle English Academy</h1>
                <p class="text-sm text-slate-500 mt-1">주간 숙제 및 수업 진도 관리 시스템</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-slate-100 p-1 rounded-xl flex">
                    <button onclick="switchGrade('grade5')" id="btn-grade5" class="px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-900 shadow-sm">초5 과정</button>
                    <button onclick="switchGrade('grade6')" id="btn-grade6" class="px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900">초6 과정</button>
                </div>
                <div class="bg-slate-100 p-1 rounded-xl flex">
                    <button onclick="switchMode('student')" id="btn-student" class="px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-indigo-600 shadow-sm">학생 모드</button>
                    <button onclick="switchMode('teacher')" id="btn-teacher" class="px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900">선생님 모드</button>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="space-y-8">
            
            <!-- 수업 진도표 섹션 -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <span>📚 이번 주 수업 진도표</span>
                        <span id="display-date" class="text-xs font-normal bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">09/26/2026 주간</span>
                    </h2>
                </div>

                <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- 진도표 카드는 자바스크립트로 학년별 동적 로드 -->
                </div>
            </section>

            <!-- 주간 숙제 체크리스트 섹션 (토~금 7일 체계) -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-lg font-bold text-slate-900">✏️ 주간 숙제 체크리스트 (Sat ~ Fri)</h2>
                        <p class="text-xs text-slate-500 mt-0.5">날짜별 숙제 항목을 확인하고 완료 체크를 하세요.</p>
                    </div>
                </div>

                <div id="homework-container" class="space-y-6">
                    <!-- 숙제 목록 동적 렌더링 -->
                </div>
            </section>

        </main>
    </div>

    <script>
        // 현재 선택된 상태 관리
        let currentGrade = 'grade5';
        let currentMode = 'student';

        // 데이터 정의
        const curriculumData = {
            grade5: {
                schedule: [
                    { period: "1교시 (Tue)", subject: "K.Listening / Voca", content: "Grade 5 K.Listening 진도 및 Voca Test", book: "진도표 참조" },
                    { period: "2교시 (Thur)", subject: "K.Reading / Voca", content: "Grade 5 K.Reading 진도 및 Voca Test", book: "진도표 참조" },
                    { period: "3교시 (Sat)", subject: "Grammar / Voca", content: "Grade 5 Grammar 및 단어 테스트", book: "진도표 참조" }
                ],
                homework: [
                    { day: "Sep 26th (Sat)", tasks: ["To watch What's goin on + 3 sentences you like.", "To write misspelled words X3.", "Grammar workbook review."] },
                    { day: "27th (Sun)", tasks: ["To listen and practice W&M.", "Reading chapter review.", "Workbook exercises."] },
                    { day: "28th (Mon)", tasks: ["To listen and practice W&M.", "Reading text analysis.", "Memorize verb forms."] },
                    { day: "29th (Tue)", tasks: ["Vocabulary test preparation.", "Dictation practice.", "Workbook corrections."] },
                    { day: "30th (Wed)", tasks: ["Dictation completion.", "Listening review."] },
                    { day: "Oct 1st (Thu)", tasks: ["Reading advanced practice.", "Voca review."] },
                    { day: "02nd (Fri)", tasks: ["Weekly final review & prep for weekend class."] }
                ]
            },
            grade6: {
                schedule: [
                    { period: "1교시 (Tue)", subject: "K.Listening / Voca (입시)", content: "Grade 7 K.Listening 6회 전반부, W&M 20 Test.", book: "To be filled in later" },
                    { period: "2교시 (Thur)", subject: "K.Reading / Voca (입시)", content: "Grade 6 K.Reading 22회. W&M 21 Test", book: "p 103" },
                    { period: "3교시 (Sat)", subject: "Grammar / Voca (입시)", content: "Grade 7 Grammar & 불규칙동사변화. W&M 22 Test", book: "p 96" }
                ],
                homework: [
                    { 
                        day: "Sep 26th (Sat)", 
                        tasks: [
                            "To watch What's goin on + 3 sentences you like.", 
                            "To write the misspelled words for Day 22 X3 + Prove. (W&M)", 
                            "To work on page 99. (K.Grammar)"
                        ] 
                    },
                    { 
                        day: "27th (Sun)", 
                        tasks: [
                            "To listen and practice Day 23 (W&M)", 
                            "To read MTH #21, chapter 1 to 3.", 
                            "To work on pages 100-102. (K.Grammar)"
                        ] 
                    },
                    { 
                        day: "28th (Mon)", 
                        tasks: [
                            "To listen and practice Day 23. (W&M)", 
                            "To read MTH #21, chapter 4 to 7.", 
                            "To memorize the 3 forms of each verb, hear to land. (K.Grammar)"
                        ] 
                    },
                    { 
                        day: "29th (Tue)", 
                        tasks: [
                            "To write the misspelled words for Day 23, X3 and Prove. (W&M)", 
                            "To do a dictation for Day 7, 1 -11. (K.Listening)", 
                            "To listen and practice Day 24. (W&M)", 
                            "To correct your wrong answers for Listening 11-15 and finish 16 -20."
                        ] 
                    },
                    { 
                        day: "30th (Wed)", 
                        tasks: [
                            "To do a dictation for Day 7, 11-20. (K.Listening)", 
                            "To listen and practice Day 24. (W&M)"
                        ] 
                    }
                ]
            }
        };

        function switchGrade(grade) {
            currentGrade = grade;
            document.getElementById('btn-grade5').className = grade === 'grade5' ? 'px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-900 shadow-sm' : 'px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900';
            document.getElementById('btn-grade6').className = grade === 'grade6' ? 'px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-900 shadow-sm' : 'px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900';
            render();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-student').className = mode === 'student' ? 'px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-indigo-600 shadow-sm' : 'px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900';
            document.getElementById('btn-teacher').className = mode === 'teacher' ? 'px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-indigo-600 shadow-sm' : 'px-4 py-2 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900';
            render();
        }

        function render() {
            const data = curriculumData[currentGrade];

            // 진도표 렌더링
            const scheduleHTML = data.schedule.map(s => `
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${s.period}</span>
                    <h3 class="font-bold text-slate-800 mt-2">${s.subject}</h3>
                    <p class="text-sm text-slate-600 mt-1">${s.content}</p>
                    <p class="text-xs text-slate-400 mt-2">교재: ${s.book}</p>
                </div>
            `).join('');
            document.getElementById('schedule-container').innerHTML = scheduleHTML;

            // 숙제 리스트 렌더링
            const homeworkHTML = data.homework.map((hw, hIdx) => `
                <div class="border border-slate-100 rounded-xl p-4 bg-slate-50/50">
                    <h3 class="font-bold text-indigo-900 mb-3 text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                        ${hw.day}
                    </h3>
                    <ul class="space-y-2">
                        ${hw.tasks.map((task, tIdx) => `
                            <li class="flex items-start gap-3 bg-white p-3 rounded-lg border border-slate-100 shadow-2xs">
                                <input type="checkbox" class="mt-1 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" ${currentMode === 'teacher' ? 'disabled' : ''}>
                                <span class="text-sm text-slate-700 flex-1">${task}</span>${currentMode === 'teacher' ? '<span class="text-xs bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded">관리자모드</span>' : ''}
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');
            document.getElementById('homework-container').innerHTML = homeworkHTML;
        }

        // 9시 이후 경고 배너 체크
        function checkTime() {
            const now = new Date();
            const hours = now.getHours();
            if (hours >= 21) {
                document.getElementById('warning-banner').classList.remove('hidden');
            }
        }

        // 초기 실행
        render();
        checkTime();
    </script>
</body>
</html>
