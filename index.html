<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle English Academy - 스마트 숙제 및 진도 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- 9시 이후 미완료 숙제 경고 배너 -->
    <div id="warning-banner" class="hidden bg-rose-600 text-white px-4 py-3 text-center font-bold shadow-md sticky top-0 z-50 flex items-center justify-center gap-2">
        <span>🚨 [알림] 저녁 9시가 지났습니다! 아직 완료하지 못한 숙제가 있는지 확인하세요!</span>
    </div>

    <!-- 상단 보라색 고정 헤더 (원래 디자인) -->
    <header class="bg-indigo-600 text-white px-4 py-6 shadow-md">
        <div class="max-w-xl mx-auto space-y-4">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🏫</span>
                <h1 class="text-xl font-bold tracking-tight">Seattle English Academy</h1>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 text-xs text-indigo-100">
                <span class="bg-indigo-700 px-2.5 py-1 rounded-md font-medium">원장 지남</span>
                <span>📞 010-8921-7812</span>
                <span class="text-indigo-200">실시간 스마트 숙제 및 진도 관리</span>
            </div>

            <!-- 모드 전환 버튼 -->
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="switchMode('teacher')" id="btn-teacher" class="py-2.5 px-4 bg-indigo-900/60 hover:bg-indigo-900 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all border border-indigo-500/30">
                    🔒 선생님 모드
                </button>
                <button onclick="switchMode('student')" id="btn-student" class="py-2.5 px-4 bg-white text-indigo-900 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-sm transition-all">
                    🎓 학생/학부모 모드
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="max-w-xl mx-auto px-4 mt-6 space-y-6" id="main-container">
        <!-- 동적 렌더링 -->
    </main>

    <script>
        // 상태 관리
        let currentMode = 'student'; // 'student' 또는 'teacher'
        let selectedGrade = '';
        let studentName = '';
        let isCheckedIn = false;

        // 초5 / 초6 진도표 및 숙제 데이터 (원장님 제공 원본 내용 반영)
        const academyData = {
            grade5: {
                name: "초5 과정",
                schedule: [
                    { period: "1교시 (Thur)", subject: "Reading + Word Test", content: "Grade 3 Harriet Tubman 내용파악과 어휘. W&M-Day 29", book: "p 99 - 101" },
                    { period: "2교시 (Sat)", subject: "Science", content: "Grade 3 Hurricane Hunters와 Plans 어휘와 토론", book: "p 108-109" },
                    { period: "3교시 (Sat)", subject: "Writing + 입시", content: "Grade 2 단어 나열시 Comma 활용법 연습. Noun/Pronoun 글쓰기 연습. Grammar 1 - 의문사", book: "p 80-82 , p 74-75" }
                ],
                homework: [
                    "1. To watch What's going on ? + 3 sentences you like.\n2. To listen and practice Day 30. (W&M)\n3. To write difficult words on page 110 , X3. (Science)",
                    "1. To finish page 81. (Writing)\n2. To read page 111 and find difficult words. (Science)\n3. To work on page 75. (K.Grammar)",
                    "1. To read MTH #10, chapter 1 to 3.\n2. To listen and practice Day 30.(W&M)",
                    "1. To read and find difficult words on page 112 . (Science)\n2. To write the misspelled words on page 82, X3. (Writing)",
                    "1. To read MTH #10, chapter 4 to 7.\n2. To listen and practice Day 30. (W&M)\n3. To memorize the 3 forms of each verb, be to bring (K.Grammar)",
                    "추후 공지 및 입력 예정",
                    "추후 공지 및 입력 예정"
                ]
            },
            grade6: {
                name: "초6 과정",
                schedule: [
                    { period: "1교시 (Tue)", subject: "K.Listening / Voca (입시)", content: "Grade 7 K.Listening 6회 전반부, W&M 20 Test.", book: "To be filled in later." },
                    { period: "2교시 (Thur)", subject: "K.Reading / Voca (입시)", content: "Grade 6 K.Reading 22회. W&M 21 Test", book: "p 103" },
                    { period: "3교시 (Sat)", subject: "Grammar / Voca (입시)", content: "Grade 7 Grammar & 불규칙동사변화. W&M 22 Test", book: "p 96" }
                ],
                homework: [
                    "1. To watch What's goin on + 3 sentences you like.\n2. To write the misspelled words for Day 22 X3 + Prove. (W&M)\n3. To work on page 99. (K.Grammar)",
                    "1. To listen and practice Day 23 .(W&M)\n2. To read MTH #21, chapter 1 to 3.\n3. To work on pages 100-102. (K.Grammar)",
                    "1. To listen and practice Day 23 . (W&M)\n2. To read MTH #21, chapter 4 to 7.\n3. To memorize the 3 forms of each verb, hear to land. (K.Grammar)",
                    "1. To write the misspelled words for Day 23,X3 and Prove. (W&M)\n2. To do a dictation for Day 7, 1 -11. (K.Listening)\n3. To listen and practice Day 24. (W&M)\n4. To correct your wrong answers for Listening 11-15 and finish 16 -20.",
                    "1. To do a dictation for Day 7, 11-20.(K.Listening)\n2. To listen and practice Day 24. (W&M)",
                    "추후 공지 및 입력 예정",
                    "추후 공지 및 입력 예정"
                ]
            }
        };

        const dayLabels = [
            "Sat (토) - 9월 26일 (토)",
            "Sun (일) - 9월 27일 (일)",
            "Mon (월) - 9월 28일 (월)",
            "Tue (화) - 9월 29일 (화)",
            "Wed (수) - 9월 30일 (수)",
            "Thu (목) - 10월 1일 (목)",
            "Fri (금) - 10월 2일 (금)"
        ];

        function switchMode(mode) {
            currentMode = mode;
            isCheckedIn = false; // 모드 변경 시 초기화
            document.getElementById('btn-student').className = mode === 'student' ? 'py-2.5 px-4 bg-white text-indigo-900 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-sm transition-all' : 'py-2.5 px-4 bg-indigo-900/60 hover:bg-indigo-900 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all border border-indigo-500/30';
            document.getElementById('btn-teacher').className = mode === 'teacher' ? 'py-2.5 px-4 bg-white text-indigo-900 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-sm transition-all' : 'py-2.5 px-4 bg-indigo-900/60 hover:bg-indigo-900 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all border border-indigo-500/30';
            render();
        }

        function render() {
            const container = document.getElementById('main-container');

            if (currentMode === 'student') {
                if (!isCheckedIn) {
                    // 학생 체크인 화면 (원래 디자인 그대로)
                    container.innerHTML = `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                            <div>
                                <h2 class="text-lg font-bold text-slate-900">학생 & 학부모 체크인</h2>
                                <p class="text-xs text-slate-500 mt-1">본인의 학년을 선택하고 이름을 입력한 뒤 숙제와 수업 진도를 확인하세요!</p>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">1. 학년 선택</label>
                                    <select id="grade-select" class="w-full p-3.5 rounded-xl border border-slate-300 text-sm bg-white font-medium focus:ring-2 focus:ring-indigo-500">
                                        <option value="">-- 학년을 선택하세요 --</option>
                                        <option value="grade5">초5 과정</option>
                                        <option value="grade6">초6 과정</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">2. 본인 이름 입력</label>
                                    <div class="flex gap-2">
                                        <input type="text" id="name-input" placeholder="이름 입력 (예: Elin)" class="flex-1 p-3.5 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
                                        <button onclick="handleCheckIn()" class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition-all">확인</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // 체크인 완료 후 보여지는 숙제 및 진도 대시보드
                    const data = getGradeData(selectedGrade);
                    container.innerHTML = `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                            <div>
                                <span class="text-xs font-bold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded">${data.name}</span>
                                <h3 class="font-bold text-slate-900 mt-1">${studentName} 학생 환영합니다!</h3>
                            </div>
                            <button onclick="resetCheckIn()" class="text-xs text-indigo-600 underline font-medium">처음으로</button>
                        </div>

                        <!-- 이번 주 수업 진도표 -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <h3 class="font-bold text-sm text-slate-900 flex items-center gap-2">
                                <span>📚 이번 주 수업 진도표</span>
                            </h3>
                            <div class="space-y-3">
                                ${data.schedule.map(s => `
                                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs space-y-1">
                                        <span class="font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${s.period}</span>
                                        <p class="font-bold text-slate-800 text-sm mt-1">${s.subject}</p>
                                        <p class="text-slate-600">${s.content}</p>
                                        <p class="text-slate-400">교재: ${s.book}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 7일 숙제 체크리스트 -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-sm text-slate-900">✏️ 주간 숙제 체크리스트 (Sat ~ Fri)</h3>
                                <span class="text-xs font-extrabold text-indigo-600" id="progress-rate">달성률: 0%</span>
                            </div>
                            <div class="space-y-4">
                                ${data.homework.map((hwText, idx) => `
                                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                                        <span class="text-xs font-bold text-indigo-900 bg-indigo-100/60 px-2 py-0.5 rounded">${dayLabels[idx]}</span>
                                        <div class="space-y-2 pt-1">
                                            ${hwText.split('\n').filter(l => l.trim() !== '').map(task => `
                                                <label class="flex items-start gap-3 bg-white p-3 rounded-lg border border-slate-200 cursor-pointer hover:border-indigo-300">
                                                    <input type="checkbox" onchange="updateProgress()" class="mt-0.5 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 task-chk">
                                                    <span class="text-sm text-slate-700 flex-1">${task}</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    updateProgress();
                }
            } else {
                // 선생님 모드 (학년별 진도 및 숙제 수정)
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                            <h2 class="text-lg font-bold text-slate-900">🔒 선생님 관리자 모드</h2>
                            <div class="flex gap-1 bg-slate-100 p-1 rounded-lg">
                                <button onclick="switchTeacherGrade('grade5')" id="t-btn-5" class="px-3 py-1.5 rounded-md text-xs font-bold bg-white text-indigo-600 shadow-sm">초5 과정</button>
                                <button onclick="switchTeacherGrade('grade6')" id="t-btn-6" class="px-3 py-1.5 rounded-md text-xs font-bold text-slate-600">초6 과정</button>
                            </div>
                        </div>

                        <div id="teacher-form-area">
                            <!-- 동적 폼 로드 -->
                        </div>
                    </div>
                `;
                renderTeacherForm('grade5');
            }
        }

        let teacherGrade = 'grade5';
        function switchTeacherGrade(grade) {
            teacherGrade = grade;
            document.getElementById('t-btn-5').className = grade === 'grade5' ? 'px-3 py-1.5 rounded-md text-xs font-bold bg-white text-indigo-600 shadow-sm' : 'px-3 py-1.5 rounded-md text-xs font-bold text-slate-600';
            document.getElementById('t-btn-6').className = grade === 'grade6' ? 'px-3 py-1.5 rounded-md text-xs font-bold bg-white text-indigo-600 shadow-sm' : 'px-3 py-1.5 rounded-md text-xs font-bold text-slate-600';
            renderTeacherForm(grade);
        }

        function renderTeacherForm(grade) {
            const data = getGradeData(grade);
            const area = document.getElementById('teacher-form-area');
            area.innerHTML = `
                <form onsubmit="saveTeacherData(event, '${grade}')" class="space-y-6">
                    <div class="space-y-4">
                        <h3 class="font-bold text-sm text-indigo-900">📚 수업 진도표 수정 (${data.name})</h3>
                        ${data.schedule.map((s, i) => `
                            <div class="p-3.5 rounded-xl border border-slate-200 bg-slate-50 space-y-2">
                                <span class="text-xs font-bold text-indigo-600">${i+1}교시</span>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                                    <input type="text" name="p_${i}" value="${s.period}" class="p-2 rounded border border-slate-300 text-xs bg-white" placeholder="교시">
                                    <input type="text" name="s_${i}" value="${s.subject}" class="p-2 rounded border border-slate-300 text-xs bg-white" placeholder="과목명">
                                    <input type="text" name="b_${i}" value="${s.book}" class="p-2 rounded border border-slate-300 text-xs bg-white" placeholder="교재">
                                </div>
                                <textarea name="c_${i}" rows="2" class="w-full p-2 rounded border border-slate-300 text-xs bg-white" placeholder="내용">${s.content}</textarea>
                            </div>
                        `).join('')}
                    </div>

                    <div class="space-y-4 pt-4 border-t border-slate-100">
                        <h3 class="font-bold text-sm text-indigo-900">✏️ 7일 숙제 공지 수정 (${data.name})</h3>
                        ${dayLabels.map((day, i) => `
                            <div class="p-3.5 rounded-xl border border-slate-200 bg-slate-50 space-y-1">
                                <label class="block font-bold text-xs text-indigo-900">${day}</label>
                                <textarea name="hw_${i}" rows="3" class="w-full p-2.5 rounded-lg border border-slate-300 text-xs bg-white">${data.homework[i] || ''}</textarea>
                            </div>
                        `).join('')}
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition-all">
                        💾 ${data.name} 변경사항 저장하기
                    </button>
                </form>
            `;
        }

        function getGradeData(grade) {
            const saved = localStorage.getItem('sea_data_' + grade);
            if (saved) return JSON.parse(saved);
            return academyData[grade];
        }

        function handleCheckIn() {
            const grade = document.getElementById('grade-select').value;
            const name = document.getElementById('name-input').value.trim();

            if (!grade) {
                alert('학년을 선택해주세요.');
                return;
            }
            if (!name) {
                alert('이름을 입력해주세요.');
                return;
            }

            selectedGrade = grade;
            studentName = name;
            isCheckedIn = true;
            render();
        }

        function resetCheckIn() {
            isCheckedIn = false;
            selectedGrade = '';
            studentName = '';
            render();
        }

        function updateProgress() {
            const chks = document.querySelectorAll('.task-chk');
            if (chks.length === 0) return;
            const checkedCount = Array.from(chks).filter(c => c.checked).length;
            const rate = Math.round((checkedCount / chks.length) * 100);
            const rateEl = document.getElementById('progress-rate');
            if (rateEl) rateEl.innerText = `달성률: ${rate}%`;
        }

        function saveTeacherData(e, grade) {
            e.preventDefault();
            const form = e.target;
            const data = getGradeData(grade);

            for (let i = 0; i < 3; i++) {
                data.schedule[i] = {
                    period: form.querySelector(`[name="p_${i}"]`).value,
                    subject: form.querySelector(`[name="s_${i}"]`).value,
                    book: form.querySelector(`[name="b_${i}"]`).value,
                    content: form.querySelector(`[name="c_${i}"]`).value
                };
            }

            for (let i = 0; i < 7; i++) {
                data.homework[i] = form.querySelector(`[name="hw_${i}"]`).value;
            }

            localStorage.setItem('sea_data_' + grade, JSON.stringify(data));
            alert('성공적으로 저장되었습니다!');
            render();
        }

        function checkTime() {
            const now = new Date();
            if (now.getHours() >= 21) {
                document.getElementById('warning-banner').classList.remove('hidden');
            }
        }

        // 초기 실행
        render();
        checkTime();
    </script>
</body>
</html>
