<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle English Academy - 스마트 숙제 검사 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- 9시 이후 미완료 숙제 경고 배너 -->
    <div id="warning-banner" class="hidden bg-rose-600 text-white px-4 py-3 text-center font-bold shadow-md sticky top-0 z-50 flex items-center justify-center gap-2">
        <span>🚨 [알림] 저녁 9시가 지났습니다! 아직 완료하지 못한 숙제가 있는지 확인하세요!</span>
    </div>

    <div class="max-w-4xl mx-auto px-4 py-6 space-y-6">
        
        <!-- 상단 보라색 스마트 숙제 검사 대시보드 헤더 -->
        <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-lg space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="bg-indigo-500 text-indigo-100 text-xs px-2.5 py-1 rounded-full font-medium">실시간 클라우드 DB 연동형 (선생님 & 학생용)</span>
                    <h1 class="text-2xl font-bold mt-2">스마트 숙제 검사 대시보드</h1>
                    <p class="text-indigo-200 text-xs mt-1">Seattle English Academy 숙제 및 진도 관리 시스템</p>
                </div>
                
                <!-- 모드 및 학년 전환 버튼 그룹 -->
                <div class="flex flex-wrap items-center gap-2 bg-indigo-700/50 p-1.5 rounded-xl">
                    <button onclick="switchGrade('grade5')" id="btn-grade5" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-indigo-900 shadow-sm">초5 과정</button>
                    <button onclick="switchGrade('grade6')" id="btn-grade6" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-indigo-200 hover:text-white">초6 과정</button>
                    <div class="w-px h-5 bg-indigo-500 mx-1"></div>
                    <button onclick="switchMode('student')" id="btn-student" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-indigo-900 shadow-sm">학생 모드</button>
                    <button onclick="switchMode('teacher')" id="btn-teacher" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-indigo-200 hover:text-white">선생님 모드</button>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main id="main-content" class="space-y-6">
            <!-- 동적 렌더링 -->
        </main>
    </div>

    <script>
        // 상태 관리
        let currentGrade = 'grade5';
        let currentMode = 'student';
        let selectedStudent = '김민준';

        // 학년별 학생 명단
        const students = {
            grade5: ["김민준", "이서연", "박지우", "오준서"],
            grade6: ["최도윤", "한예은", "강민서", "조서진"]
        };

        // 기본 진도 및 숙제 데이터
        const defaultData = {
            grade5: {
                schedule: [
                    { period: "1교시 (Thur)", subject: "Reading + Word Test", content: "Grade 3 Harriet Tubman 내용파악과 어휘. W&M-Day 29", book: "p 99 - 101" },
                    { period: "2교시 (Sat)", subject: "Science", content: "Grade 3 Hurricane Hunters와 Plans 어휘와 토론", book: "p 108-109" },
                    { period: "3교시 (Sat)", subject: "Writing + 입시", content: "Grade 2 단어 나열시 Comma 활용법 연습. Noun/Pronoun 글쓰기 연습. Grammar 1 - 의문사", book: "p 80-82 , p 74-75" }
                ],
                homework: [
                    "1. To watch What's going on ? + 3 sentences you like.\n2. To listen and practice Day 30. (W&M)\n3. To write difficult words on page 110 , X3. (Science)",
                    "1. To finish page 81. (Writing)\n2. To read page 111 and find difficult words. (Science)\n3. To work on page 75. (K.Grammar)",
                    "1. To read MTH #10, chapter 1 to 3.\n2. To listen and practice Day 30.(W&M)",
                    "1. To read and find difficult words on page 112 . (Science)\n2. To write the misspelled words on page 82, X3. (Writing)",
                    "1. To read MTH #10, chapter 4 to 7.\n2. To listen and practice Day 30. (W&M)\n3. To memorize the 3 forms of each verb, be to bring (K.Grammar)",
                    "추후 공지 및 입력 예정",
                    "추후 공지 및 입력 예정"
                ]
            },
            grade6: {
                schedule: [
                    { period: "1교시 (Tue)", subject: "K.Listening / Voca (입시)", content: "Grade 7 K.Listening 6회 전반부, W&M 20 Test.", book: "To be filled in later." },
                    { period: "2교시 (Thur)", subject: "K.Reading / Voca (입시)", content: "Grade 6 K.Reading 22회. W&M 21 Test", book: "p 103" },
                    { period: "3교시 (Sat)", subject: "Grammar / Voca (입시)", content: "Grade 7 Grammar & 불규칙동사변화. W&M 22 Test", book: "p 96" }
                ],
                homework: [
                    "1. To watch What's goin on + 3 sentences you like.\n2. To write the misspelled words for Day 22 X3 + Prove. (W&M)\n3. To work on page 99. (K.Grammar)",
                    "1. To listen and practice Day 23 .(W&M)\n2. To read MTH #21, chapter 1 to 3.\n3. To work on pages 100-102. (K.Grammar)",
                    "1. To listen and practice Day 23 . (W&M)\n2. To read MTH #21, chapter 4 to 7.\n3. To memorize the 3 forms of each verb, hear to land. (K.Grammar)",
                    "1. To write the misspelled words for Day 23,X3 and Prove. (W&M)\n2. To do a dictation for Day 7, 1 -11. (K.Listening)\n3. To listen and practice Day 24. (W&M)\n4. To correct your wrong answers for Listening 11-15 and finish 16 -20.",
                    "1. To do a dictation for Day 7, 11-20.(K.Listening)\n2. To listen and practice Day 24. (W&M)",
                    "추후 공지 및 입력 예정",
                    "추후 공지 및 입력 예정"
                ]
            }
        };

        const dayLabels = [
            "Sat (토) - 9월 26일 (토)",
            "Sun (일) - 9월 27일 (일)",
            "Mon (월) - 9월 28일 (월)",
            "Tue (화) - 9월 29일 (화)",
            "Wed (수) - 9월 30일 (수)",
            "Thu (목) - 10월 1일 (목)",
            "Fri (금) - 10월 2일 (금)"
        ];

        function getData() {
            const saved = localStorage.getItem('sea_data_' + currentGrade);
            if (saved) return JSON.parse(saved);
            return defaultData[currentGrade];
        }

        function switchGrade(grade) {
            currentGrade = grade;
            selectedStudent = students[grade][0]; // 학년 변경시 첫 학생 선택
            document.getElementById('btn-grade5').className = grade === 'grade5' ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-indigo-900 shadow-sm' : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-indigo-200 hover:text-white';
            document.getElementById('btn-grade6').className = grade === 'grade6' ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-indigo-900 shadow-sm' : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-indigo-200 hover:text-white';
            render();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-student').className = mode === 'student' ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-indigo-900 shadow-sm' : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-indigo-200 hover:text-white';
            document.getElementById('btn-teacher').className = mode === 'teacher' ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-indigo-900 shadow-sm' : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-indigo-200 hover:text-white';
            render();
        }

        function render() {
            const data = getData();
            const container = document.getElementById('main-content');
            const currentStudents = students[currentGrade];

            if (currentMode === 'student') {
                container.innerHTML = `
                    <!-- 학생 숙제 체크인 카드 -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div>
                            <h2 class="text-base font-bold text-slate-900">학생 숙제 체크인</h2>
                            <p class="text-xs text-slate-500 mt-1">본인의 이름을 선택하고 선생님이 지정하신 숙제 날짜와 내용을 확인한 뒤 체크하세요!</p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1.5">내 이름 찾기</label>
                            <select id="student-select" onchange="changeStudent(this.value)" class="w-full p-3 rounded-xl border border-slate-300 text-sm bg-white font-medium focus:ring-2 focus:ring-indigo-500">
                                ${currentStudents.map(s => `<option value="${s}" ${s === selectedStudent ? 'selected' : ''}>[${currentGrade === 'grade5' ? '초5 과정' : '초6 과정'}] ${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <!-- 학생별 대시보드 상태 카드 -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-slate-100 gap-2">
                            <div>
                                <span class="text-xs font-bold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">${currentGrade === 'grade5' ? '초5 과정' : '초6 과정'}</span>
                                <h3 class="text-xl font-bold text-slate-900 mt-1.5">${selectedStudent} 학생</h3>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-400">전체 완료율</span>
                                <div class="text-2xl font-extrabold text-indigo-600" id="progress-rate">0%</div>
                            </div>
                        </div>

                        <!-- 7일 숙제 체크리스트 -->
                        <div class="space-y-4">
                            <h4 class="font-bold text-sm text-slate-800">📅 주간 숙제 체크리스트 (Sat ~ Fri)</h4>
                            ${data.homework.map((hwText, idx) => `
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs font-bold text-indigo-900 bg-indigo-100/60 px-2 py-1 rounded">${dayLabels[idx]}</span>
                                    </div>
                                    <div class="space-y-2">
                                        ${hwText.split('\n').filter(l => l.trim() !== '').map((task, tIdx) => `
                                            <label class="flex items-start gap-3 bg-white p-3 rounded-lg border border-slate-200 cursor-pointer hover:border-indigo-300 transition-all">
                                                <input type="checkbox" onchange="updateProgress()" class="mt-0.5 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 task-chk">
                                                <span class="text-sm text-slate-700 flex-1">${task}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- 이번 주 진도표 참고용 -->
                        <div class="pt-4 border-t border-slate-100 space-y-3">
                            <h4 class="font-bold text-sm text-slate-800">📚 이번 주 수업 진도표 요약</h4>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                ${data.schedule.map(s => `
                                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                                        <span class="font-bold text-indigo-600">${s.period}</span>
                                        <p class="font-bold text-slate-800">${s.subject}</p>
                                        <p class="text-slate-500 truncate">${s.content}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                updateProgress();
            } else {
                // 선생님 모드 대시보드 화면
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                            <div>
                                <h2 class="text-lg font-bold text-slate-900">선생님 관리자 모드 (${currentGrade === 'grade5' ? '초5' : '초6'})</h2>
                                <p class="text-xs text-slate-500 mt-0.5">수업 진도표와 7일간의 숙제 내용을 직접 등록하고 수정하세요.</p>
                            </div>
                        </div>

                        <!-- 진도표 수정 영역 -->
                        <div class="space-y-4">
                            <h3 class="font-bold text-sm text-indigo-900">📚 진도표 관리</h3>
                            <form onsubmit="saveSchedule(event)" class="space-y-4">
                                ${data.schedule.map((s, i) => `
                                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
                                        <span class="text-xs font-bold text-indigo-600">${i+1}교시 정보</span>
                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                                            <input type="text" name="p_${i}" value="${s.period}" class="p-2 rounded border border-slate-300 text-xs bg-white">
                                            <input type="text" name="s_${i}" value="${s.subject}" class="p-2 rounded border border-slate-300 text-xs bg-white" placeholder="과목명">
                                            <input type="text" name="b_${i}" value="${s.book}" class="p-2 rounded border border-slate-300 text-xs bg-white" placeholder="교재 범위">
                                        </div>
                                        <textarea name="c_${i}" rows="2" class="w-full p-2 rounded border border-slate-300 text-xs bg-white" placeholder="상세 내용">${s.content}</textarea>
                                    </div>
                                `).join('')}
                                <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold text-sm rounded-xl shadow hover:bg-indigo-700">진도표 저장하기</button>
                            </form>
                        </div>

                        <!-- 숙제 공지 수정 영역 -->
                        <div class="space-y-4 pt-6 border-t border-slate-100">
                            <h3 class="font-bold text-sm text-indigo-900">✏️ 7일 숙제 공지 관리 (Sat ~ Fri)</h3>
                            <form onsubmit="saveHomework(event)" class="space-y-4">
                                ${dayLabels.map((day, i) => `
                                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-2">
                                        <label class="block font-bold text-xs text-indigo-900">${day}</label>
                                        <textarea name="hw_${i}" rows="4" class="w-full p-3 rounded-lg border border-slate-300 text-xs bg-white">${data.homework[i] || ''}</textarea>
                                    </div>
                                `).join('')}
                                <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold text-sm rounded-xl shadow hover:bg-indigo-700">숙제 공지 저장하기</button>
                            </form>
                        </div>
                    </div>
                `;
            }
        }

        function changeStudent(name) {
            selectedStudent = name;
        }

        function updateProgress() {
            const chks = document.querySelectorAll('.task-chk');
            if (chks.length === 0) return;
            const checkedCount = Array.from(chks).filter(c => c.checked).length;
            const rate = Math.round((checkedCount / chks.length) * 100);
            const rateEl = document.getElementById('progress-rate');
            if (rateEl) rateEl.innerText = rate + '%';
        }

        function saveSchedule(e) {
            e.preventDefault();
            const form = e.target;
            const data = getData();
            for (let i = 0; i < 3; i++) {
                data.schedule[i] = {
                    period: form.querySelector(`[name="p_${i}"]`).value,
                    subject: form.querySelector(`[name="s_${i}"]`).value,
                    book: form.querySelector(`[name="b_${i}"]`).value,
                    content: form.querySelector(`[name="c_${i}"]`).value
                };
            }
            localStorage.setItem('sea_data_' + currentGrade, JSON.stringify(data));
            alert('진도표가 성공적으로 저장되었습니다!');
            render();
        }

        function saveHomework(e) {
            e.preventDefault();
            const form = e.target;
            const data = getData();
            for (let i = 0; i < 7; i++) {
                data.homework[i] = form.querySelector(`[name="hw_${i}"]`).value;
            }
            localStorage.setItem('sea_data_' + currentGrade, JSON.stringify(data));
            alert('숙제 공지가 성공적으로 저장되었습니다!');
            render();
        }

        // 초기 실행
        render();
    </script>
</body>
</html>
